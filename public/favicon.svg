<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Deep Carbon Background -->
  <rect width="32" height="32" rx="6" fill="#0D0F12" />
  <rect width="32" height="32" rx="6" stroke="#22262F" stroke-width="1" />

  <!-- Upper Isometric Bracket Loop -->
  <path d="M 7 15 L 7 10 L 16 5 L 25 10 L 25 14" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Lower Isometric Bracket Loop -->
  <path d="M 25 17 L 25 22 L 16 27 L 7 22 L 7 18" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Interlocking Cycle Connectors -->
  <path d="M 11 13.5 L 16 16.5 L 21 13.5" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 21 18.5 L 16 15.5 L 11 18.5" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Emerald Precision Billing Checkpoint Indicator -->
  <circle cx="25" cy="10" r="2.2" fill="#10B981" />
  <circle cx="25" cy="10" r="4.2" stroke="#10B981" stroke-width="1" stroke-opacity="0.45" />
</svg>
